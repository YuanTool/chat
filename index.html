<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聊天系统（回复正常+转发模拟发消息）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial;background:#f1f1f1;height:100vh;overflow:hidden}
.container{display:flex;height:100vh;max-width:1200px;margin:0 auto}
.sidebar{width:280px;background:white;border-right:1px solid #ddd;padding:15px;display:flex;flex-direction:column;}
.hamburger{display:none;font-size:22px;background:none;border:none;position:fixed;top:10px;left:10px;z-index:10;background:white;padding:5px 10px;border-radius:5px;cursor:pointer;}
@media (max-width:600px){.sidebar{display:none;width:100%;position:fixed;height:100vh;z-index:9}.sidebar.show{display:flex}.hamburger{display:block}}
.my-id-card{background:#eef;padding:12px;border-radius:8px;margin:10px 0;font-size:14px;color:#333;display:flex;align-items:center;justify-content:space-between;}
.my-id-card span{font-weight:bold;color:#2563eb}
.btn-nick{background:#4F46E5;color:white;border:none;padding:4px 8px;border-radius:4px;font-size:12px;cursor:pointer;}
.btn{background:#4F46E5;color:white;border:none;padding:10px 12px;border-radius:6px;margin:5px 0;width:100%;cursor:pointer;font-size:14px;}
.btn-request{background:#f59e0b}
.section-title{font-weight:bold;margin-top:20px;margin-bottom:10px;font-size:16px;color:#333;}
.friend-list,.request-list,.group-list{flex:1;overflow-y:auto;margin-top:5px;position:relative;}
.friend-item,.request-item,.group-item{padding:10px;background:#f9f9f9;margin:5px 0;border-radius:6px;cursor:pointer;font-size:14px;position:relative;}
.request-item{display:flex;justify-content:space-between;align-items:center;background:#fffbeb;border:1px solid #f59e0b;}
.request-btn-group button{padding:4px 8px;border:none;border-radius:4px;margin-left:5px;cursor:pointer;font-size:12px;}
.btn-accept{background:#10b981;color:white}
.btn-reject{background:#ef4444;color:white}
.empty-tip{color:#999;padding:10px;font-size:14px;text-align:center;}
.chat-area{flex:1;display:flex;flex-direction:column;background:white;}
.chat-header{padding:15px;border-bottom:1px solid #ddd;font-weight:bold;font-size:16px;display:flex;justify-content:space-between;align-items:center;}
.messages-container{flex:1;padding:15px;overflow-y:auto;background:#f9fafb;}
.message-item{margin:8px 0;padding:10px 14px;border-radius:8px;max-width:70%;font-size:14px;display:flex;flex-direction:column;}
.message-mine{background:#4F46E5;color:white;margin-left:auto;align-items:flex-end;}
.message-other{background:#e5e7eb;margin-right:auto;}

.quote{background:rgba(0,0,0,0.1);padding:6px 8px;border-radius:6px;margin-bottom:6px;font-size:12px;border-left:3px solid #4F46E5;}
.quote-user{font-weight:bold;margin-bottom:2px;}
.quote-content{opacity:0.9;}

.file-card{background:rgba(0,0,0,0.1);padding:8px 10px;border-radius:6px;margin:4px 0;font-size:13px;color:inherit;}
.file-name{font-weight:bold;margin-bottom:4px;}
.file-size{opacity:0.8;font-size:12px;}
.download-btn{background:none;border:none;color:#4F46E5;cursor:pointer;font-size:12px;padding:0;text-align:left;margin-top:4px;}
.download-btn:hover{text-decoration:underline;}

.msg-actions{display:flex;gap:8px;margin-top:6px;font-size:12px;}
.msg-actions button{background:none;border:none;color:inherit;opacity:0.7;cursor:pointer;font-size:12px;}
.msg-actions button:hover{opacity:1;}

.input-container{display:flex;padding:10px;border-top:1px solid #ddd;background:white;position:relative;align-items:center;}
.input-container input{flex:1;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:14px;outline:none;}
.input-container button{margin-left:8px;padding:10px 16px;background:#4F46E5;color:white;border:none;border-radius:6px;cursor:pointer;}
.btn-file{background:#f3f4f6;border:none;border-radius:6px;padding:10px;width:40px;display:grid;place-items:center;font-size:16px;cursor:pointer;}
.btn-emoji{background:#f3f4f6;border:none;border-radius:6px;padding:10px;margin-left:8px;cursor:pointer;font-size:16px;}
.emoji-panel{position:absolute;bottom:60px;right:10px;background:white;border:1px solid #ddd;border-radius:8px;padding:8px;display:none;grid-template-columns:repeat(3,1fr);gap:8px;z-index:10;}
.emoji-panel span{font-size:20px;cursor:pointer;padding:4px;text-align:center;}
.emoji-panel span:hover{background:#f3f4f6;border-radius:4px;}

.reply-preview{padding:8px 12px;background:#eef;border-radius:6px;margin-bottom:6px;font-size:14px;display:flex;justify-content:space-between;align-items:center;}
.reply-preview span{font-weight:bold;color:#2563eb}
.reply-close{background:none;border:none;color:#666;cursor:pointer;}

.context-menu{position:absolute;background:white;border:1px solid #ddd;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,0.1);z-index:999;min-width:120px;display:none;}
.context-menu-item{padding:8px 12px;cursor:pointer;font-size:14px;}
.context-menu-item:hover{background:#f3f4f6;}
.context-menu-item.danger{color:#ef4444;}
</style>
</head>
<body>
<button class="hamburger" onclick="toggleSidebar()">☰</button>
<div class="container">
  <div class="sidebar" id="sidebar">
    <div class="section-title">我的账号</div>
    <div class="my-id-card" id="myIdCard">
      <div>ID：<span id="myIdText">加载中...</span></div>
      <button class="btn-nick" id="setNickBtn">设置昵称</button>
    </div>

    <button class="btn" onclick="showAddFriendModal()">➕ 添加好友</button>
    <button class="btn btn-request" onclick="toggleRequestList()">📩 好友申请</button>

    <div class="section-title">好友列表</div>
    <div class="friend-list" id="friendList" oncontextmenu="return false;">
      <div class="empty-tip">暂无好友</div>
    </div>

    <div class="section-title" id="requestTitle" style="display:none">好友申请</div>
    <div class="request-list" id="requestList" style="display:none"><div class="empty-tip">暂无申请</div></div>

    <div class="section-title">群聊</div>
    <button class="btn" onclick="createGroup()">➕ 创建群</button>
    <button class="btn" onclick="joinGroup()">➕ 加入群</button>
    <div class="group-list" id="groupList" oncontextmenu="return false;">
      <div class="empty-tip">暂无群</div>
    </div>
  </div>

  <div class="chat-area">
    <div class="chat-header" id="chatHeader">
      <span id="chatTitle">选择聊天</span>
      <span id="groupActionBtn" style="display:none;"></span>
    </div>
    <div class="messages-container" id="messagesContainer"></div>
    <div id="replyPreview" style="display:none;padding:8px 12px;background:#eef;border-radius:6px;margin:8px;">
      回复：<span id="replyToText"></span>
      <button onclick="cancelReply()" style="margin-left:8px;">×</button>
    </div>
    <div class="input-container">
      <button class="btn-file" onclick="document.getElementById('fileInput').click()">📎</button>
      <input type="file" id="fileInput" style="display:none" accept="image/*,audio/*">
      <input type="text" id="messageInput" placeholder="输入消息...">
      <button class="btn-emoji" onclick="toggleEmoji()">😊</button>
      <button onclick="smartSend()">发送</button>
      <div class="emoji-panel" id="emojiPanel">
        <span onclick="insertEmoji('😊')">😊</span><span onclick="insertEmoji('😂')">😂</span><span onclick="insertEmoji('🥰')">🥰</span>
        <span onclick="insertEmoji('👍')">👍</span><span onclick="insertEmoji('🔥')">🔥</span><span onclick="insertEmoji('😭')">😭</span>
        <span onclick="insertEmoji('😎')">😎</span><span onclick="insertEmoji('❤️')">❤️</span><span onclick="insertEmoji('🎉')">🎉</span>
      </div>
    </div>
  </div>
</div>

<div class="context-menu" id="friendContextMenu">
  <div class="context-menu-item danger" id="deleteFriendBtn">删除好友</div>
</div>
<div class="context-menu" id="groupContextMenu">
  <div class="context-menu-item danger" id="exitGroupBtn">退出群聊</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4/dist/umd/supabase.min.js"></script>
<script>
// 核心配置
const SUPABASE_URL = "https://hlhtcciaafwmxxtshtaa.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsaHRjY2lhYWZ3bXh4dHNodGFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzMDcyOTcsImV4cCI6MjA5MDg4MzI5N30.cn6RJt_0xXp54n2NvqMq0mFYwBVmdO6Q2NGdnwZicoU";

let supabaseClient;
let myId;
let myNick = "";
let currentChatId = null; // 单聊ID
let currentGroupId = null; // 群聊ID
let currentGroupCreator = null; // 群主ID
let replyMsgId = null; // 回复的消息ID
let replyContent = ""; // 回复的内容
let replyNick = ""; // 回复的用户昵称
let requestVisible = false; // 好友申请列表是否显示
const MAX_FILE_SIZE = 50 * 1024 * 1024; // 最大文件50MB

// 右键菜单相关
let currentRightClickFriendId = null;
let currentRightClickGroupId = null;
const friendContextMenu = document.getElementById('friendContextMenu');
const groupContextMenu = document.getElementById('groupContextMenu');

// 页面加载初始化
window.onload = async () => {
  try {
    // 初始化 Supabase
    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: false },
      global: { headers: { 'Content-Type': 'application/json' } }
    });

    // 生成/获取用户ID
    myId = sessionStorage.getItem("chatId") || generateId();
    sessionStorage.setItem("chatId", myId);
    document.getElementById("myIdText").innerText = myId;

    // 确保用户表存在当前用户
    await supabaseClient.from("users").upsert({ 
      id: myId, 
      nickname: myNick || myId 
    }, { onConflict: "id" });

    // 获取用户昵称
    const { data: me } = await supabaseClient.from("users").select("nickname").eq("id", myId).single();
    if (me) myNick = me.nickname || myId;

    // 设置昵称按钮事件
    document.getElementById("setNickBtn").onclick = async () => {
      const newNick = prompt("设置昵称", myNick || "");
      if (newNick === null || newNick.trim() === "") return;
      await supabaseClient.from("users").update({ nickname: newNick.trim() }).eq("id", myId);
      myNick = newNick.trim();
      alert("昵称已更新");
      loadFriendList();
      if(currentGroupId) loadGroupMessages();
    };

    // 右键菜单事件绑定
    document.getElementById('deleteFriendBtn').onclick = deleteCurrentFriend;
    document.getElementById('exitGroupBtn').onclick = exitCurrentGroup;
    document.addEventListener('click', closeAllContextMenus);

    // 订阅实时更新
    subscribeRealtime();
    
    // 加载初始数据
    await loadFriendList();
    await loadFriendRequests();
    await loadGroupList();

    // 定时清理过期数据
    setInterval(async () => {
      try {
        const oneHourAgo = new Date(Date.now() - 3600000).toISOString();
        const fifteenMinAgo = new Date(Date.now() - 900000).toISOString();
        
        // 删除1小时前的消息
        await supabaseClient.from("messages").delete().lt("created_at", oneHourAgo);
        await supabaseClient.from("group_messages").delete().lt("created_at", oneHourAgo);
        
        // 删除15分钟前的文件
        const { data: oldFiles } = await supabaseClient.storage.from("uploads").list("chat", {
          createdBefore: fifteenMinAgo
        });
        if(oldFiles?.length) {
          await supabaseClient.storage.from("uploads").remove(oldFiles.map(f => `chat/${f.name}`));
        }
      } catch (e) {
        console.log("清理过期数据失败:", e);
      }
    }, 60000);

  } catch (error) {
    console.error("初始化失败:", error);
    alert("初始化失败，请刷新页面重试");
  }
};

// 生成8位随机ID
function generateId() {
  const chars = "0123456789abcdefghijklmnopqrstuvwxyz";
  return Array.from({ length: 8 }, () => chars[Math.floor(Math.random() * chars.length)]).join("");
}

// 获取用户昵称
async function getNick(uid) {
  try {
    const { data } = await supabaseClient.from("users").select("nickname").eq("id", uid).single();
    return data?.nickname || uid;
  } catch {
    return uid;
  }
}

// 侧边栏切换（移动端）
function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("show");
}

// 关闭所有右键菜单
function closeAllContextMenus() {
  friendContextMenu.style.display = 'none';
  groupContextMenu.style.display = 'none';
}

// 显示好友右键菜单
function showFriendContextMenu(e, friendId) {
  e.preventDefault();
  currentRightClickFriendId = friendId;
  friendContextMenu.style.left = `${e.pageX}px`;
  friendContextMenu.style.top = `${e.pageY}px`;
  friendContextMenu.style.display = 'block';
}

// 显示群聊右键菜单
function showGroupContextMenu(e, groupId) {
  e.preventDefault();
  currentRightClickGroupId = groupId;
  groupContextMenu.style.left = `${e.pageX}px`;
  groupContextMenu.style.top = `${e.pageY}px`;
  groupContextMenu.style.display = 'block';
}

// 删除好友
async function deleteCurrentFriend() {
  if(!currentRightClickFriendId || !confirm("确定要删除该好友吗？")) return;
  try {
    await supabaseClient.from("friend_requests").delete()
      .or(`(from_id.eq.${myId},to_id.eq.${currentRightClickFriendId}),
           (from_id.eq.${currentRightClickFriendId},to_id.eq.${myId})`);
    alert("好友已删除");
    loadFriendList();
    if(currentChatId === currentRightClickFriendId) {
      currentChatId = null;
      document.getElementById("chatTitle").innerText = "选择聊天";
      document.getElementById("messagesContainer").innerHTML = "";
    }
  } catch (e) {
    console.error("删除好友失败:", e);
    alert("删除失败，请重试");
  }
  closeAllContextMenus();
}

// 退出群聊
async function exitCurrentGroup() {
  if(!currentRightClickGroupId || !confirm("确定要退出该群聊吗？")) return;
  try {
    await supabaseClient.from("group_members").delete()
      .eq("group_id", currentRightClickGroupId).eq("user_id", myId);
    alert("已退出群聊");
    loadGroupList();
    if(currentGroupId === currentRightClickGroupId) {
      currentGroupId = null;
      document.getElementById("chatTitle").innerText = "选择聊天";
      document.getElementById("groupActionBtn").style.display = "none";
      document.getElementById("messagesContainer").innerHTML = "";
    }
  } catch (e) {
    console.error("退出群聊失败:", e);
    alert("退出失败，请重试");
  }
  closeAllContextMenus();
}

// 显示添加好友弹窗
function showAddFriendModal() {
  const targetId = prompt("输入对方ID（8位）");
  if (!targetId || targetId.length !== 8 || targetId === myId) {
    alert("请输入有效的8位用户ID");
    return;
  }
  sendFriendRequest(targetId);
}

// 发送好友申请
async function sendFriendRequest(tid) {
  try {
    const { data: user } = await supabaseClient.from("users").select("id").eq("id", tid).maybeSingle();
    if (!user) return alert("用户不存在");
    
    // 检查是否已发送过申请
    const { data: exist } = await supabaseClient.from("friend_requests")
      .select("id")
      .or(`(from_id.eq.${myId},to_id.eq.${tid}),
           (from_id.eq.${tid},to_id.eq.${myId})`)
      .limit(1);
    
    if (exist?.length) return alert("已发送过好友申请/已是好友");

    await supabaseClient.from("friend_requests").insert({ 
      from_id: myId, 
      to_id: tid, 
      status: "pending" 
    });
    alert("好友申请已发送");
  } catch (e) {
    console.error("发送申请失败:", e);
    alert("发送申请失败，请重试");
  }
}

// 切换好友申请列表显示
function toggleRequestList() {
  requestVisible = !requestVisible;
  document.getElementById("requestTitle").style.display = requestVisible ? "block" : "none";
  document.getElementById("requestList").style.display = requestVisible ? "block" : "none";
  if (requestVisible) loadFriendRequests();
}

// 加载好友申请
async function loadFriendRequests() {
  try {
    const { data: requests } = await supabaseClient.from("friend_requests")
      .select("*")
      .eq("to_id", myId)
      .eq("status", "pending");
    
    const el = document.getElementById("requestList");
    if (!requests?.length) { 
      el.innerHTML = "<div class='empty-tip'>暂无好友申请</div>"; 
      return; 
    }
    
    let html = "";
    for (let req of requests) {
      const nick = await getNick(req.from_id);
      html += `
        <div class="request-item">
          <span>${nick} (${req.from_id})</span>
          <div class="request-btn-group">
            <button class="btn-accept" onclick="acceptFriendRequest('${req.id}')">同意</button>
            <button class="btn-reject" onclick="rejectFriendRequest('${req.id}')">拒绝</button>
          </div>
        </div>
      `;
    }
    el.innerHTML = html;
  } catch (e) {
    console.error("加载申请失败:", e);
    document.getElementById("requestList").innerHTML = "<div class='empty-tip'>加载失败</div>";
  }
}

// 同意好友申请
async function acceptFriendRequest(id) {
  try {
    await supabaseClient.from("friend_requests").update({ status: "accepted" }).eq("id", id);
    loadFriendRequests(); 
    loadFriendList();
    alert("已同意好友申请");
  } catch (e) {
    console.error("同意申请失败:", e);
    alert("操作失败，请重试");
  }
}

// 拒绝好友申请
async function rejectFriendRequest(id) {
  try {
    await supabaseClient.from("friend_requests").update({ status: "rejected" }).eq("id", id);
    loadFriendRequests();
    alert("已拒绝好友申请");
  } catch (e) {
    console.error("拒绝申请失败:", e);
    alert("操作失败，请重试");
  }
}

// 加载好友列表
async function loadFriendList() {
  try {
    // 获取我发送的已通过的申请
    const { data: sent } = await supabaseClient.from("friend_requests")
      .select("to_id")
      .eq("from_id", myId)
      .eq("status", "accepted");
    
    // 获取我收到的已通过的申请
    const { data: received } = await supabaseClient.from("friend_requests")
      .select("from_id")
      .eq("to_id", myId)
      .eq("status", "accepted");
    
    // 合并并去重
    const friendIds = [...new Set([
      ...(sent||[]).map(i=>i.to_id), 
      ...(received||[]).map(i=>i.from_id)
    ])];
    
    const el = document.getElementById("friendList");
    if (!friendIds.length) { 
      el.innerHTML = "<div class='empty-tip'>暂无好友</div>"; 
      return; 
    }
    
    let html = "";
    for (let id of friendIds) {
      const nick = await getNick(id);
      html += `<div class="friend-item" 
                onclick="selectFriend('${id}')" 
                oncontextmenu="showFriendContextMenu(event, '${id}')">
                ${nick} (${id})
              </div>`;
    }
    el.innerHTML = html;
  } catch (e) {
    console.error("加载好友列表失败:", e);
    document.getElementById("friendList").innerHTML = "<div class='empty-tip'>加载失败</div>";
  }
}

// 选择好友聊天
function selectFriend(id) {
  currentChatId = id; 
  currentGroupId = null; 
  currentGroupCreator = null;
  
  getNick(id).then(nick => {
    document.getElementById("chatTitle").innerText = `和 ${nick} 聊天`;
    document.getElementById("groupActionBtn").style.display = "none";
  });
  
  if (window.innerWidth <= 600) toggleSidebar();
  loadChatMessages();
}

// 开始回复消息（保留你原本正常的逻辑）
function startReply(msgId, content, nick) {
  replyMsgId = msgId || null;
  replyContent = (content || "").substring(0, 30);
  replyNick = nick || "未知用户";
  
  const preview = document.getElementById("replyPreview");
  document.getElementById("replyToText").innerText = `${replyNick}: ${replyContent || '无内容'}`;
  preview.style.display = "block";
}

// 取消回复
function cancelReply() {
  replyMsgId = null;
  replyContent = "";
  replyNick = "";
  document.getElementById("replyPreview").style.display = "none";
}

// ======================== 核心修改：转发=模拟发消息 ========================
async function doForward(msgId, isGroupMsg, origContent, origFile, origNick) {
  try {
    // 1. 第一步：选转发目标（好友/群）
    let targetType = null; // friend/group
    let targetId = null;
    
    // 先让用户选转发类型
    const typeChoice = prompt("转发类型：\n1. 好友\n2. 群聊");
    if(!typeChoice) return;
    
    if(typeChoice === "1") {
      // 选好友
      const { data: friends1 } = await supabaseClient.from("friend_requests").select("to_id").eq("from_id", myId).eq("status", "accepted");
      const { data: friends2 } = await supabaseClient.from("friend_requests").select("from_id").eq("to_id", myId).eq("status", "accepted");
      const friendIds = [...new Set([...(friends1||[]).map(i=>i.to_id), ...(friends2||[]).map(i=>i.from_id)])];
      
      if(friendIds.length === 0) return alert("暂无好友可转发");
      
      // 列好友列表
      let friendTip = "选择转发的好友（输入序号）：\n";
      const friendMap = {};
      friendIds.forEach((fid, idx) => {
        friendMap[idx+1] = fid;
        friendTip += `${idx+1}. ${await getNick(fid)} (${fid})\n`;
      });
      
      const friendIdx = prompt(friendTip);
      if(!friendIdx || !friendMap[friendIdx]) return alert("无效序号");
      
      targetType = "friend";
      targetId = friendMap[friendIdx];
    } else if(typeChoice === "2") {
      // 选群聊
      const { data: myGroups } = await supabaseClient.from("group_members").select("group_id").eq("user_id", myId);
      const groupIds = myGroups?.map(g=>g.group_id) || [];
      
      if(groupIds.length === 0) return alert("暂无群聊可转发");
      
      // 列群列表
      let groupTip = "选择转发的群聊（输入序号）：\n";
      const groupMap = {};
      for(let idx = 0; idx < groupIds.length; idx++) {
        const gid = groupIds[idx];
        const { data: group } = await supabaseClient.from("groups").select("name").eq("id", gid).single();
        groupMap[idx+1] = gid;
        groupTip += `${idx+1}. ${group?.name || "未命名群"} (${gid})\n`;
      }
      
      const groupIdx = prompt(groupTip);
      if(!groupIdx || !groupMap[groupIdx]) return alert("无效序号");
      
      targetType = "group";
      targetId = groupMap[groupIdx];
    } else {
      return alert("请输入1或2");
    }

    // 2. 第二步：模拟发消息（核心！和手动发消息逻辑完全一致）
    const forwardText = `【转发自${origNick}】${origContent || "[文件]"}`;
    
    if(targetType === "friend") {
      // 转发到好友 = 给这个好友发一条新消息
      await supabaseClient.from("messages").insert({
        from_id: myId,
        to_id: targetId,
        content: forwardText,
        file_url: origFile || null, // 带文件的话直接传文件链接
        file_name: null,
        file_size: null,
        forward_info: null,
        reply_to_id: null, // 转发不带回复
        reply_content: null,
        reply_nickname: null
      });
      // 刷新目标好友的聊天（如果当前正在聊这个好友）
      if(currentChatId === targetId) loadChatMessages();
    } else {
      // 转发到群聊 = 给这个群发一条新消息
      await supabaseClient.from("group_messages").insert({
        group_id: targetId,
        from_id: myId,
        content: forwardText,
        file_url: origFile || null,
        file_name: null,
        file_size: null,
        forward_info: null,
        reply_to_id: null,
        reply_content: null,
        reply_nickname: null
      });
      // 刷新目标群的聊天（如果当前正在聊这个群）
      if(currentGroupId === targetId) loadGroupMessages();
    }

    alert("转发成功！（已模拟发送一条新消息）");

  } catch (e) {
    console.error("转发失败:", e);
    alert(`转发失败：${e.message || '未知错误'}`);
  }
}

// 加载单聊消息
async function loadChatMessages() {
  if (!currentChatId) return;
  try {
    // 获取我发送的消息
    const { data: sentMsgs } = await supabaseClient.from("messages")
      .select("*")
      .eq("from_id", myId)
      .eq("to_id", currentChatId);
    
    // 获取我收到的消息
    const { data: recvMsgs } = await supabaseClient.from("messages")
      .select("*")
      .eq("from_id", currentChatId)
      .eq("to_id", myId);
    
    // 合并并排序
    const allMessages = [...(sentMsgs||[]), ...(recvMsgs||[])]
      .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
    
    const container = document.getElementById("messagesContainer");
    let html = "";

    for (let msg of allMessages) {
      const isMine = msg.from_id === myId;
      const senderNick = await getNick(msg.from_id);
      
      html += `<div class="message-item ${isMine ? 'message-mine' : 'message-other'}">`;
      
      // 回复引用（保留你原本正常的逻辑）
      if (msg.reply_content) {
        html += `<div class="quote">
                  <div class="quote-user">${msg.reply_nickname || '未知用户'}</div>
                  <div class="quote-content">${msg.reply_content}</div>
                </div>`;
      }
      
      // 消息内容
      html += `${msg.content || ''}`;
      
      // 文件卡片
      if (msg.file_url) {
        html += `<div class="file-card">
                  <div class="file-name">${msg.file_name || '文件'}</div>
                  <button class="download-btn" onclick="window.open('${msg.file_url}')">下载</button>
                </div>`;
      }
      
      // 消息操作按钮
      html += `<div class="msg-actions">`;
      if (!isMine) {
        html += `<button onclick="startReply('${msg.id}','${msg.content||''}','${senderNick}')">回复</button>`;
      }
      html += `<button onclick="doForward('${msg.id}',false,'${msg.content||''}','${msg.file_url||''}','${senderNick}')">转发</button>`;
      if (isMine) {
        html += `<button onclick="revokeMsg('${msg.id}')">撤回</button>`;
      }
      html += `</div></div>`;
    }

    container.innerHTML = html;
    container.scrollTop = container.scrollHeight; // 滚动到底部

  } catch (e) {
    console.error("加载聊天消息失败:", e);
    document.getElementById("messagesContainer").innerHTML = "<div class='empty-tip'>加载消息失败</div>";
  }
}

// 撤回消息
async function revokeMsg(id) {
  if (!confirm("确定要撤回这条消息吗？")) return;
  try {
    await supabaseClient.from("messages").delete().eq("id", id);
    loadChatMessages();
    alert("消息已撤回");
  } catch (e) {
    console.error("撤回消息失败:", e);
    alert("撤回失败，请重试");
  }
}

// 发送消息（保留你原本正常的回复逻辑）
async function smartSend() {
  try {
    const content = document.getElementById("messageInput").value.trim();
    
    // 检查是否选择了聊天对象
    if (!currentChatId && !currentGroupId) {
      alert("请先选择要聊天的好友/群聊");
      return;
    }

    // 检查消息内容
    if (!content && !replyMsgId) {
      alert("请输入消息内容");
      return;
    }

    if (currentChatId) {
      // 发送单聊消息（带回复）
      await supabaseClient.from("messages").insert({
        from_id: myId,
        to_id: currentChatId,
        content: content,
        file_url: null,
        file_name: null,
        file_size: null,
        forward_info: null,
        reply_to_id: replyMsgId || null,
        reply_content: replyContent || null,
        reply_nickname: replyNick || null
      });
      // 刷新单聊消息
      cancelReply();
      loadChatMessages();

    } else if (currentGroupId) {
      // 发送群聊消息（带回复）
      await supabaseClient.from("group_messages").insert({
        group_id: currentGroupId,
        from_id: myId,
        content: content,
        file_url: null,
        file_name: null,
        file_size: null,
        forward_info: null,
        reply_to_id: replyMsgId || null,
        reply_content: replyContent || null,
        reply_nickname: replyNick || null
      });
      // 刷新群聊消息
      cancelReply();
      loadGroupMessages();
    }

    // 清空输入框
    document.getElementById("messageInput").value = "";

  } catch (e) {
    console.error("发送消息失败:", e);
    alert(`发送失败：${e.message || '请检查网络或重试'}`);
  }
}

// 创建群聊
async function createGroup() {
  const groupName = prompt("请输入群聊名称");
  if (!groupName || groupName.trim() === "") {
    alert("群聊名称不能为空");
    return;
  }
  
  try {
    const groupId = generateId();
    // 创建群聊
    await supabaseClient.from("groups").insert({ 
      id: groupId, 
      name: groupName.trim(), 
      creator_id: myId 
    });
    // 添加自己为群成员
    await supabaseClient.from("group_members").insert({ 
      group_id: groupId, 
      user_id: myId 
    });
    
    alert(`群聊创建成功！群ID：${groupId}`);
    loadGroupList();

  } catch (e) {
    console.error("创建群聊失败:", e);
    alert("创建群聊失败，请重试");
  }
}

// 加入群聊
async function joinGroup() {
  const groupId = prompt("请输入要加入的群ID（8位）");
  if (!groupId || groupId.length !== 8) {
    alert("请输入有效的8位群ID");
    return;
  }
  
  try {
    // 检查群是否存在
    const { data: group } = await supabaseClient.from("groups")
      .select("id")
      .eq("id", groupId)
      .single();
    
    if (!group) return alert("群聊不存在");

    // 检查是否已加入
    const { data: member } = await supabaseClient.from("group_members")
      .select("id")
      .eq("group_id", groupId)
      .eq("user_id", myId)
      .single();
    
    if (member) return alert("你已加入该群聊");

    // 加入群聊
    await supabaseClient.from("group_members").insert({ 
      group_id: groupId, 
      user_id: myId 
    });
    
    alert("加入群聊成功");
    loadGroupList();

  } catch (e) {
    console.error("加入群聊失败:", e);
    alert("加入失败，请重试");
  }
}

// 加载群聊列表
async function loadGroupList() {
  try {
    // 获取我加入的所有群
    const { data: myGroupMembers } = await supabaseClient.from("group_members")
      .select("group_id")
      .eq("user_id", myId);
    
    if (!myGroupMembers?.length) { 
      document.getElementById("groupList").innerHTML = "<div class='empty-tip'>暂无群聊</div>"; 
      return; 
    }

    // 获取群聊信息
    const groupIds = myGroupMembers.map(i=>i.group_id);
    const { data: groups } = await supabaseClient.from("groups")
      .select("*")
      .in("id", groupIds);
    
    let html = "";
    for (let group of groups) {
      // 获取群成员数量
      const { data: members } = await supabaseClient.from("group_members")
        .select("user_id")
        .eq("group_id", group.id);
      
      html += `<div class="friend-item group-item" 
                onclick="openGroup('${group.id}','${group.name}','${group.creator_id}')" 
                oncontextmenu="showGroupContextMenu(event, '${group.id}')">
                ${group.name} (${members?.length || 0}人)
              </div>`;
    }
    document.getElementById("groupList").innerHTML = html;

  } catch (e) {
    console.error("加载群聊列表失败:", e);
    document.getElementById("groupList").innerHTML = "<div class='empty-tip'>加载失败</div>";
  }
}

// 打开群聊
async function openGroup(gid, name, creatorId) {
  currentGroupId = gid; 
  currentChatId = null; 
  currentGroupCreator = creatorId;
  
  document.getElementById("chatTitle").innerText = `群聊：${name}`;
  
  // 群主显示解散按钮
  const actionBtn = document.getElementById("groupActionBtn");
  if(creatorId === myId) {
    actionBtn.style.display = "block";
    actionBtn.innerHTML = `<button style="background:#ef4444;color:white;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;" onclick="dissolveGroup('${gid}')">解散群聊</button>`;
  } else {
    actionBtn.style.display = "none";
  }
  
  if (window.innerWidth <= 600) toggleSidebar();
  loadGroupMessages();
}

// 解散群聊（仅群主）
async function dissolveGroup(gid) {
  if(!confirm("确定要解散该群聊吗？解散后所有数据将被删除！")) return;
  try {
    // 删除群成员
    await supabaseClient.from("group_members").delete().eq("group_id", gid);
    // 删除群消息
    await supabaseClient.from("group_messages").delete().eq("group_id", gid);
    // 删除群聊
    await supabaseClient.from("groups").delete().eq("id", gid);
    
    alert("群聊已解散");
    loadGroupList();
    
    // 清空聊天状态
    currentGroupId = null;
    document.getElementById("chatTitle").innerText = "选择聊天";
    document.getElementById("groupActionBtn").style.display = "none";
    document.getElementById("messagesContainer").innerHTML = "";

  } catch (e) {
    console.error("解散群聊失败:", e);
    alert("解散失败，请重试");
  }
}

// 加载群聊消息
async function loadGroupMessages() {
  if(!currentGroupId) return;
  try {
    const { data: messages } = await supabaseClient.from("group_messages")
      .select("*")
      .eq("group_id", currentGroupId)
      .order("created_at", { ascending: true });
    
    const container = document.getElementById("messagesContainer");
    let html = "";

    for (let msg of messages||[]) {
      const isMine = msg.from_id === myId;
      const senderNick = await getNick(msg.from_id);
      
      html += `<div class="message-item ${isMine ? 'message-mine' : 'message-other'}">`;
      
      // 回复引用（保留你原本正常的逻辑）
      if (msg.reply_content) {
        html += `<div class="quote">
                  <div class="quote-user">${msg.reply_nickname || '未知用户'}</div>
                  <div class="quote-content">${msg.reply_content}</div>
                </div>`;
      }
      
      // 消息内容（显示发送者昵称）
      html += `${senderNick}：${msg.content || ''}`;
      
      // 文件卡片
      if (msg.file_url) {
        html += `<div class="file-card">
                  <div class="file-name">${msg.file_name || '文件'}</div>
                  <button class="download-btn" onclick="window.open('${msg.file_url}')">下载</button>
                </div>`;
      }
      
      // 消息操作按钮
      html += `<div class="msg-actions">
                <button onclick="startReply('${msg.id}','${msg.content||''}','${senderNick}')">回复</button>
                <button onclick="doForward('${msg.id}',true,'${msg.content||''}','${msg.file_url||''}','${senderNick}')">转发</button>
              </div></div>`;
    }

    container.innerHTML = html;
    container.scrollTop = container.scrollHeight;

  } catch (e) {
    console.error("加载群消息失败:", e);
    document.getElementById("messagesContainer").innerHTML = "<div class='empty-tip'>加载消息失败</div>";
  }
}

// 发送文件
document.getElementById("fileInput").addEventListener("change", async e=>{
  const file = e.target.files[0]; 
  if (!file) return;
  
  // 检查文件大小
  if(file.size > MAX_FILE_SIZE) {
    alert("文件大小不能超过50MB");
    e.target.value = "";
    return;
  }

  try {
    // 生成唯一文件名
    const fileName = `${myId}_${Date.now()}_${file.name.replace(/[^a-zA-Z0-9_\-\.]+/g, '_')}`;
    
    // 上传文件到Supabase Storage
    const { error: uploadError } = await supabaseClient.storage
      .from("uploads")
      .upload(`chat/${fileName}`, file, {
        cacheControl: '3600',
        upsert: false
      });
    
    if(uploadError) throw uploadError;

    // 获取文件公网链接
    const { data: urlData } = supabaseClient.storage
      .from("uploads")
      .getPublicUrl(`chat/${fileName}`);
    const fileUrl = urlData.publicUrl;

    // 发送文件消息
    if (currentChatId) {
      await supabaseClient.from("messages").insert({
        from_id: myId,
        to_id: currentChatId,
        content: "",
        file_url: fileUrl,
        file_name: file.name,
        file_size: file.size,
        forward_info: null,
        reply_to_id: null,
        reply_content: null,
        reply_nickname: null
      });
      loadChatMessages();
    } else if (currentGroupId) {
      await supabaseClient.from("group_messages").insert({
        group_id: currentGroupId,
        from_id: myId,
        content: "",
        file_url: fileUrl,
        file_name: file.name,
        file_size: file.size,
        forward_info: null,
        reply_to_id: null,
        reply_content: null,
        reply_nickname: null
      });
      loadGroupMessages();
    } else {
      alert("请先选择聊天对象");
      // 删除已上传的文件
      await supabaseClient.storage.from("uploads").remove([`chat/${fileName}`]);
    }

  } catch (e) {
    console.error("发送文件失败:", e);
    alert(`文件发送失败：${e.message || '请重试'}`);
  }
  
  // 清空文件选择
  e.target.value = "";
});

// 订阅实时更新
function subscribeRealtime() {
  // 先移除所有旧频道
  supabaseClient.removeAllChannels();
  
  // 单聊消息实时更新
  supabaseClient.channel("chat_messages")
    .on("postgres_changes", { 
      event: "*", 
      schema: "public", 
      table: "messages" 
    }, () => {
      if(currentChatId) loadChatMessages();
    })
    .subscribe();

  // 群聊消息实时更新
  supabaseClient.channel("group_messages")
    .on("postgres_changes", { 
      event: "*", 
      schema: "public", 
      table: "group_messages" 
    }, () => {
      if(currentGroupId) loadGroupMessages();
    })
    .subscribe();

  // 好友关系实时更新
  supabaseClient.channel("friend_requests")
    .on("postgres_changes", { 
      event: "*", 
      schema: "public", 
      table: "friend_requests" 
    }, () => {
      loadFriendList();
      loadFriendRequests();
    })
    .subscribe();

  // 群聊实时更新
  supabaseClient.channel("groups")
    .on("postgres_changes", { 
      event: "*", 
      schema: "public", 
      table: "groups" 
    }, () => {
      loadGroupList();
    })
    .subscribe();
}

// 表情面板切换
function toggleEmoji() {
  const panel = document.getElementById("emojiPanel");
  panel.style.display = panel.style.display === "none" ? "grid" : "none";
}

// 插入表情
function insertEmoji(emoji) {
  const input = document.getElementById("messageInput");
  input.value += emoji;
  input.focus();
  toggleEmoji();
}
