<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聊天系统（完整版）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial;background:#f1f1f1;height:100vh;overflow:hidden}
.container{display:flex;height:100vh;max-width:1200px;margin:0 auto}
.sidebar{width:280px;background:white;border-right:1px solid #ddd;padding:15px;display:flex;flex-direction:column;}
.hamburger{display:none;font-size:22px;background:none;border:none;position:fixed;top:10px;left:10px;z-index:10;background:white;padding:5px 10px;border-radius:5px;cursor:pointer;}
@media (max-width:600px){.sidebar{display:none;width:100%;position:fixed;height:100vh;z-index:9}.sidebar.show{display:flex}.hamburger{display:block}}
.my-id-card{background:#eef;padding:12px;border-radius:8px;margin:10px 0;font-size:14px;color:#333;display:flex;align-items:center;justify-content:space-between;}
.my-id-card span{font-weight:bold;color:#2563eb}
.btn-nick{background:#4F46E5;color:white;border:none;padding:4px 8px;border-radius:4px;font-size:12px;cursor:pointer;}
.btn{background:#4F46E5;color:white;border:none;padding:10px 12px;border-radius:6px;margin:5px 0;width:100%;cursor:pointer;font-size:14px;}
.btn-request{background:#f59e0b}
.section-title{font-weight:bold;margin-top:20px;margin-bottom:10px;font-size:16px;color:#333;}
.friend-list,.request-list,.group-list{flex:1;overflow-y:auto;margin-top:5px;position:relative;}
.friend-item,.request-item,.group-item{padding:10px;background:#f9f9f9;margin:5px 0;border-radius:6px;cursor:pointer;font-size:14px;position:relative;}
.request-item{display:flex;justify-content:space-between;align-items:center;background:#fffbeb;border:1px solid #f59e0b;}
.request-btn-group button{padding:4px 8px;border:none;border-radius:4px;margin-left:5px;cursor:pointer;font-size:12px;}
.btn-accept{background:#10b981;color:white}
.btn-reject{background:#ef4444;color:white}
.empty-tip{color:#999;padding:10px;font-size:14px;text-align:center;}
.chat-area{flex:1;display:flex;flex-direction:column;background:white;}
.chat-header{padding:15px;border-bottom:1px solid #ddd;font-weight:bold;font-size:16px;display:flex;justify-content:space-between;align-items:center;}
.messages-container{flex:1;padding:15px;overflow-y:auto;background:#f9fafb;}
.message-item{margin:8px 0;padding:10px 14px;border-radius:8px;max-width:70%;font-size:14px;display:flex;flex-direction:column;}
.message-mine{background:#4F46E5;color:white;margin-left:auto;align-items:flex-end;}
.message-other{background:#e5e7eb;margin-right:auto;}

.quote{background:rgba(0,0,0,0.1);padding:6px 8px;border-radius:6px;margin-bottom:6px;font-size:12px;border-left:3px solid #4F46E5;}
.quote-user{font-weight:bold;margin-bottom:2px;}
.quote-content{opacity:0.9;}

.file-card{background:rgba(0,0,0,0.1);padding:8px 10px;border-radius:6px;margin:4px 0;font-size:13px;color:inherit;}
.file-name{font-weight:bold;margin-bottom:4px;}
.file-size{opacity:0.8;font-size:12px;}
.download-btn{background:none;border:none;color:#4F46E5;cursor:pointer;font-size:12px;padding:0;text-align:left;margin-top:4px;}
.download-btn:hover{text-decoration:underline;}

.msg-actions{display:flex;gap:8px;margin-top:6px;font-size:12px;}
.msg-actions button{background:none;border:none;color:inherit;opacity:0.7;cursor:pointer;font-size:12px;}
.msg-actions button:hover{opacity:1;}

.input-container{display:flex;padding:10px;border-top:1px solid #ddd;background:white;position:relative;align-items:center;}
.input-container input{flex:1;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:14px;outline:none;}
.input-container button{margin-left:8px;padding:10px 16px;background:#4F46E5;color:white;border:none;border-radius:6px;cursor:pointer;}
.btn-file{background:#f3f4f6;border:none;border-radius:6px;padding:10px;width:40px;display:grid;place-items:center;font-size:16px;cursor:pointer;}
.btn-emoji{background:#f3f4f6;border:none;border-radius:6px;padding:10px;margin-left:8px;cursor:pointer;font-size:16px;}
.emoji-panel{position:absolute;bottom:60px;right:10px;background:white;border:1px solid #ddd;border-radius:8px;padding:8px;display:none;grid-template-columns:repeat(3,1fr);gap:8px;z-index:10;}
.emoji-panel span{font-size:20px;cursor:pointer;padding:4px;text-align:center;}
.emoji-panel span:hover{background:#f3f4f6;border-radius:4px;}

.reply-preview{padding:8px 12px;background:#eef;border-radius:6px;margin-bottom:6px;font-size:14px;display:flex;justify-content:space-between;align-items:center;}
.reply-preview span{font-weight:bold;color:#2563eb}
.reply-close{background:none;border:none;color:#666;cursor:pointer;}

.context-menu{position:absolute;background:white;border:1px solid #ddd;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,0.1);z-index:999;min-width:120px;display:none;}
.context-menu-item{padding:8px 12px;cursor:pointer;font-size:14px;}
.context-menu-item:hover{background:#f3f4f6;}
.context-menu-item.danger{color:#ef4444;}
</style>
</head>
<body>
<button class="hamburger" onclick="toggleSidebar()">☰</button>
<div class="container">
  <div class="sidebar" id="sidebar">
    <div class="section-title">我的账号</div>
    <div class="my-id-card" id="myIdCard">
      <div>ID：<span id="myIdText">加载中...</span></div>
      <button class="btn-nick" id="setNickBtn">设置昵称</button>
    </div>

    <button class="btn" onclick="showAddFriendModal()">➕ 添加好友</button>
    <button class="btn btn-request" onclick="toggleRequestList()">📩 好友申请</button>

    <div class="section-title">好友列表</div>
    <div class="friend-list" id="friendList" oncontextmenu="return false;">
      <div class="empty-tip">暂无好友</div>
    </div>

    <div class="section-title" id="requestTitle" style="display:none">好友申请</div>
    <div class="request-list" id="requestList" style="display:none"><div class="empty-tip">暂无申请</div></div>

    <div class="section-title">群聊</div>
    <button class="btn" onclick="createGroup()">➕ 创建群</button>
    <button class="btn" onclick="joinGroup()">➕ 加入群</button>
    <div class="group-list" id="groupList" oncontextmenu="return false;">
      <div class="empty-tip">暂无群</div>
    </div>
  </div>

  <div class="chat-area">
    <div class="chat-header" id="chatHeader">
      <span id="chatTitle">选择聊天</span>
      <span id="groupActionBtn" style="display:none;"></span>
    </div>
    <div class="messages-container" id="messagesContainer"></div>
    <div id="replyPreview" style="display:none;padding:8px 12px;background:#eef;border-radius:6px;margin:8px;">
      回复：<span id="replyToText"></span>
      <button onclick="cancelReply()" style="margin-left:8px;">×</button>
    </div>
    <div class="input-container">
      <button class="btn-file" onclick="document.getElementById('fileInput').click()">📎</button>
      <input type="file" id="fileInput" style="display:none" accept="image/*,audio/*">
      <input type="text" id="messageInput" placeholder="输入消息...">
      <button class="btn-emoji" onclick="toggleEmoji()">😊</button>
      <button onclick="smartSend()">发送</button>
      <div class="emoji-panel" id="emojiPanel">
        <span onclick="insertEmoji('😊')">😊</span><span onclick="insertEmoji('😂')">😂</span><span onclick="insertEmoji('🥰')">🥰</span>
        <span onclick="insertEmoji('👍')">👍</span><span onclick="insertEmoji('🔥')">🔥</span><span onclick="insertEmoji('😭')">😭</span>
        <span onclick="insertEmoji('😎')">😎</span><span onclick="insertEmoji('❤️')">❤️</span><span onclick="insertEmoji('🎉')">🎉</span>
      </div>
    </div>
  </div>
</div>

<div class="context-menu" id="friendContextMenu">
  <div class="context-menu-item danger" id="deleteFriendBtn">删除好友</div>
</div>
<div class="context-menu" id="groupContextMenu">
  <div class="context-menu-item danger" id="exitGroupBtn">退出群聊</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://hlhtcciaafwmxxtshtaa.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsaHRjY2lhYWZ3bXh4dHNodGFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzMDcyOTcsImV4cCI6MjA5MDg4MzI5N30.cn6RJt_0xXp54n2NvqMq0mFYwBVmdO6Q2NGdnwZicoU";

let supabaseClient;
let myId;
let myNick = "";
let currentChatId = null;
let currentGroupId = null;
let currentGroupCreator = null;
let replyMsgId = null;
let replyContent = "";
let replyNick = "";
let requestVisible = false;
const MAX_FILE_SIZE = 50 * 1024 * 1024;

let currentRightClickFriendId = null;
let currentRightClickGroupId = null;
const friendContextMenu = document.getElementById('friendContextMenu');
const groupContextMenu = document.getElementById('groupContextMenu');

window.onload = async () => {
  supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  myId = sessionStorage.getItem("chatId") || generateId();
  sessionStorage.setItem("chatId", myId);
  document.getElementById("myIdText").innerText = myId;

  await supabaseClient.from("users").upsert({ id: myId }, { onConflict: "id" });
  const { data: me } = await supabaseClient.from("users").select("nickname").eq("id", myId).single();
  if (me) myNick = me.nickname || "";

  document.getElementById("setNickBtn").onclick = async () => {
    const newNick = prompt("设置昵称", myNick || "");
    if (newNick === null) return;
    await supabaseClient.from("users").update({ nickname: newNick }).eq("id", myId);
    myNick = newNick;
    alert("昵称已更新");
    loadFriendList();
    if(currentGroupId) loadGroupMessages();
  };

  document.getElementById('deleteFriendBtn').onclick = deleteCurrentFriend;
  document.getElementById('exitGroupBtn').onclick = exitCurrentGroup;
  document.addEventListener('click', closeAllContextMenus);

  subscribeRealtime();
  loadFriendList();
  loadFriendRequests();
  loadGroupList();

  setInterval(async () => {
    await supabaseClient.from("messages").delete().lt("created_at", new Date(Date.now() - 3600000).toISOString());
    await supabaseClient.from("group_messages").delete().lt("created_at", new Date(Date.now() - 3600000).toISOString());
    const { data: oldFiles } = await supabaseClient.storage.from("uploads").list("chat", {
      createdBefore: new Date(Date.now() - 900000).toISOString()
    });
    if(oldFiles?.length) {
      await supabaseClient.storage.from("uploads").remove(oldFiles.map(f => `chat/${f.name}`));
    }
  }, 60000);
};

function generateId() {
  const c = "0123456789abcdefghijklmnopqrstuvwxyz";
  return Array.from({ length: 8 }, () => c[Math.floor(Math.random() * c.length)]).join("");
}

async function getNick(uid) {
  const { data } = await supabaseClient.from("users").select("nickname").eq("id", uid).single();
  return data?.nickname || uid;
}

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("show");
}

function closeAllContextMenus() {
  friendContextMenu.style.display = 'none';
  groupContextMenu.style.display = 'none';
}

function showFriendContextMenu(e, friendId) {
  e.preventDefault();
  currentRightClickFriendId = friendId;
  friendContextMenu.style.left = e.pageX + 'px';
  friendContextMenu.style.top = e.pageY + 'px';
  friendContextMenu.style.display = 'block';
}

function showGroupContextMenu(e, groupId) {
  e.preventDefault();
  currentRightClickGroupId = groupId;
  groupContextMenu.style.left = e.pageX + 'px';
  groupContextMenu.style.top = e.pageY + 'px';
  groupContextMenu.style.display = 'block';
}

async function deleteCurrentFriend() {
  if(!currentRightClickFriendId || !confirm("确定要删除该好友吗？")) return;
  await supabaseClient.from("friend_requests").delete()
    .or(`(from_id.eq.${myId}.and.to_id.eq.${currentRightClickFriendId})`
    + `, (from_id.eq.${currentRightClickFriendId}.and.to_id.eq.${myId})`);
  alert("好友已删除");
  loadFriendList();
  if(currentChatId === currentRightClickFriendId) {
    currentChatId = null;
    document.getElementById("chatTitle").innerText = "选择聊天";
    document.getElementById("messagesContainer").innerHTML = "";
  }
  closeAllContextMenus();
}

async function exitCurrentGroup() {
  if(!currentRightClickGroupId || !confirm("确定要退出该群聊吗？")) return;
  await supabaseClient.from("group_members").delete()
    .eq("group_id", currentRightClickGroupId).eq("user_id", myId);
  alert("已退出群聊");
  loadGroupList();
  if(currentGroupId === currentRightClickGroupId) {
    currentGroupId = null;
    document.getElementById("chatTitle").innerText = "选择聊天";
    document.getElementById("groupActionBtn").style.display = "none";
    document.getElementById("messagesContainer").innerHTML = "";
  }
  closeAllContextMenus();
}

function showAddFriendModal() {
  const t = prompt("输入对方ID");
  if (!t || t.length !== 8 || t === myId) return;
  sendFriendRequest(t);
}

async function sendFriendRequest(tid) {
  const { data: u } = await supabaseClient.from("users").select("id").eq("id", tid).maybeSingle();
  if (!u) return alert("用户不存在");
  await supabaseClient.from("friend_requests").insert({ from_id: myId, to_id: tid, status: "pending" });
  alert("申请已发送");
}

function toggleRequestList() {
  requestVisible = !requestVisible;
  document.getElementById("requestTitle").style.display = requestVisible ? "block" : "none";
  document.getElementById("requestList").style.display = requestVisible ? "block" : "none";
  if (requestVisible) loadFriendRequests();
}

async function loadFriendRequests() {
  const { data: r } = await supabaseClient.from("friend_requests").select("*").eq("to_id", myId).eq("status", "pending");
  const el = document.getElementById("requestList");
  if (!r?.length) { el.innerHTML = "<div class='empty-tip'>暂无申请</div>"; return; }
  el.innerHTML = r.map(x => `
    <div class="request-item">
      <span>${x.from_id}</span>
      <div class="request-btn-group">
        <button class="btn-accept" onclick="acceptFriendRequest('${x.id}')">同意</button>
        <button class="btn-reject" onclick="rejectFriendRequest('${x.id}')">拒绝</button>
      </div>
    </div>
  `).join("");
}

async function acceptFriendRequest(id) {
  await supabaseClient.from("friend_requests").update({ status: "accepted" }).eq("id", id);
  loadFriendRequests(); loadFriendList();
}

async function rejectFriendRequest(id) {
  await supabaseClient.from("friend_requests").update({ status: "rejected" }).eq("id", id);
  loadFriendRequests();
}

async function loadFriendList() {
  const { data: s } = await supabaseClient.from("friend_requests").select("to_id").eq("from_id", myId).eq("status", "accepted");
  const { data: r } = await supabaseClient.from("friend_requests").select("from_id").eq("to_id", myId).eq("status", "accepted");
  const arr = [...(s||[]).map(i=>i.to_id), ...(r||[]).map(i=>i.from_id)];
  const uniq = [...new Set(arr)];
  const el = document.getElementById("friendList");
  if (!uniq.length) { el.innerHTML = "<div class='empty-tip'>暂无好友</div>"; return; }
  let html = "";
  for (let id of uniq) {
    const n = await getNick(id);
    html += `<div class="friend-item" onclick="selectFriend('${id}')" oncontextmenu="showFriendContextMenu(event, '${id}')">${n}</div>`;
  }
  el.innerHTML = html;
}

function selectFriend(id) {
  currentChatId = id; currentGroupId = null; currentGroupCreator = null;
  getNick(id).then(n => {
    document.getElementById("chatTitle").innerText = "和 "+n+" 聊天";
    document.getElementById("groupActionBtn").style.display = "none";
  });
  if (window.innerWidth<=600) toggleSidebar();
  loadChatMessages();
}

function startReply(msgId, content, nick) {
  replyMsgId = msgId;
  replyContent = content.substring(0,30);
  replyNick = nick;
  const p = document.getElementById("replyPreview");
  document.getElementById("replyToText").innerText = `${nick}: ${replyContent}`;
  p.style.display = "block";
}

function cancelReply() {
  replyMsgId = null; replyContent = ""; replyNick = "";
  document.getElementById("replyPreview").style.display = "none";
}

async function doForward(msgId, isGroup, origContent, origFile, origNick) {
  const { data: friends } = await supabaseClient.from("friend_requests").select("to_id").eq("from_id", myId).eq("status", "accepted");
  const { data: friendsR } = await supabaseClient.from("friend_requests").select("from_id").eq("to_id", myId).eq("status", "accepted");
  const { data: groups } = await supabaseClient.from("group_members").select("group_id").eq("user_id", myId);
  
  let friendList = [...(friends||[]).map(i=>i.to_id), ...(friendsR||[]).map(i=>i.from_id)];
  let groupList = groups?.map(i=>i.group_id) || [];
  
  let options = [];
  for(let fid of friendList) {
    const n = await getNick(fid);
    options.push(`好友: ${n} (${fid})`);
  }
  for(let gid of groupList) {
    const { data: g } = await supabaseClient.from("groups").select("name").eq("id", gid).single();
    options.push(`群聊: ${g.name} (${gid})`);
  }
  
  if(options.length === 0) return alert("没有可转发的好友/群");
  
  const target = prompt("请选择转发目标（输入序号）:\n" + options.map((o,i)=>`${i+1}. ${o}`).join("\n"));
  if(!target) return;
  const idx = parseInt(target)-1;
  if(idx <0 || idx >= options.length) return alert("序号无效");
  
  const isToFriend = options[idx].startsWith("好友:");
  const targetId = options[idx].split("(")[1].split(")")[0];
  const text = origContent || "[文件]";
  const info = `转发自 ${origNick}: ${text.substring(0,20)}`;

  if (isGroup) {
    if(isToFriend) {
      await supabaseClient.from("messages").insert({
        from_id: myId, to_id: targetId, content: text,
        forward_info: info, file_url: origFile, file_name: null, file_size: null
      });
      alert("已转发");
    } else {
      await supabaseClient.from("group_messages").insert({
        group_id: targetId, from_id: myId, content: text,
        forward_info: info, file_url: origFile, file_name: null, file_size: null
      });
      alert("已转发");
    }
    loadGroupMessages();
  } else {
    if(isToFriend) {
      await supabaseClient.from("messages").insert({
        from_id: myId, to_id: targetId, content: text,
        forward_info: info, file_url: origFile, file_name: null, file_size: null
      });
      alert("已转发");
    } else {
      await supabaseClient.from("group_messages").insert({
        group_id: targetId, from_id: myId, content: text,
        forward_info: info, file_url: origFile, file_name: null, file_size: null
      });
      alert("已转发");
    }
    loadChatMessages();
  }
}

async function loadChatMessages() {
  if (!currentChatId) return;
  const { data: m1 } = await supabaseClient.from("messages").select("*").eq("from_id", myId).eq("to_id", currentChatId);
  const { data: m2 } = await supabaseClient.from("messages").select("*").eq("from_id", currentChatId).eq("to_id", myId);
  const all = [...(m1||[]), ...(m2||[])].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  const box = document.getElementById("messagesContainer");
  let html = "";
  for (let m of all) {
    const mine = m.from_id === myId;
    const nick = await getNick(m.from_id);
    html += `<div class="message-item ${mine ? 'message-mine' : 'message-other'}">`;
    if (m.reply_content) {
      html += `<div class="quote"><div class="quote-user">${m.reply_nickname}</div><div class="quote-content">${m.reply_content}</div></div>`;
    }
    if (m.forward_info) html += `<div style="font-size:12px;opacity:0.8">${m.forward_info}</div>`;
    html += `${m.content||''}`;
    if (m.file_url) {
      html += `<div class="file-card"><div class="file-name">${m.file_name||'文件'}</div>`;
      html += `<button class="download-btn" onclick="window.open('${m.file_url}')">下载</button></div>`;
    }
    html += `<div class="msg-actions">`;
    if (!mine) html += `<button onclick="startReply('${m.id}','${m.content||''}','${nick}')">回复</button>`;
    html += `<button onclick="doForward('${m.id}',false,'${m.content||''}','${m.file_url||''}','${nick}')">转发</button>`;
    if (mine) html += `<button onclick="revokeMsg('${m.id}')">撤回</button>`;
    html += `</div></div>`;
  }
  box.innerHTML = html;
  box.scrollTop = box.scrollHeight;
}

async function revokeMsg(id) {
  if (!confirm("撤回？")) return;
  await supabaseClient.from("messages").delete().eq("id", id);
  loadChatMessages();
}

async function smartSend() {
  const c = document.getElementById("messageInput").value.trim();

  if (!currentChatId && !currentGroupId) {
    alert("请先选择聊天对象");
    return;
  }

  if (currentGroupId) {
    await supabaseClient.from("group_messages").insert({
      group_id: currentGroupId, from_id: myId, content: c,
      reply_to_id: replyMsgId, reply_content: replyContent, reply_nickname: replyNick
    });
    cancelReply();
    loadGroupMessages();
  } else if (currentChatId) {
    await supabaseClient.from("messages").insert({
      from_id: myId, to_id: currentChatId, content: c,
      reply_to_id: replyMsgId, reply_content: replyContent, reply_nickname: replyNick
    });
    cancelReply();
    loadChatMessages();
  }

  document.getElementById("messageInput").value = "";
}

async function createGroup() {
  const name = prompt("群名");
  if (!name) return;
  const gid = generateId();
  await supabaseClient.from("groups").insert({ id: gid, name: name, creator_id: myId });
  await supabaseClient.from("group_members").insert({ group_id: gid, user_id: myId });
  alert("创建成功："+gid); loadGroupList();
}

async function joinGroup() {
  const gid = prompt("群ID");
  if (!gid) return;
  await supabaseClient.from("group_members").insert({ group_id: gid, user_id: myId });
  loadGroupList();
}

async function loadGroupList() {
  const { data: gm } = await supabaseClient.from("group_members").select("group_id").eq("user_id", myId);
  if (!gm?.length) { document.getElementById("groupList").innerHTML = "<div class='empty-tip'>暂无群</div>"; return; }
  const gids = gm.map(i=>i.group_id);
  const { data: gs } = await supabaseClient.from("groups").select("*").in("id", gids);
  let html = "";
  for (let g of gs) {
    const { data: m } = await supabaseClient.from("group_members").select("user_id").eq("group_id", g.id);
    html += `<div class="friend-item group-item" onclick="openGroup('${g.id}','${g.name}','${g.creator_id}')" oncontextmenu="showGroupContextMenu(event, '${g.id}')">${g.name} (${m?.length||0}人)</div>`;
  }
  document.getElementById("groupList").innerHTML = html;
}

async function openGroup(gid, name, creatorId) {
  currentGroupId = gid; currentChatId = null; currentGroupCreator = creatorId;
  document.getElementById("chatTitle").innerText = "群："+name;
  
  const actionBtn = document.getElementById("groupActionBtn");
  if(creatorId === myId) {
    actionBtn.style.display = "block";
    actionBtn.innerHTML = `<button style="background:#ef4444;color:white;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;" onclick="dissolveGroup('${gid}')">解散群聊</button>`;
  } else {
    actionBtn.style.display = "none";
  }
  
  if (window.innerWidth<=600) toggleSidebar();
  loadGroupMessages();
}

async function dissolveGroup(gid) {
  if(!confirm("群主身份，确定要解散该群聊吗？解散后所有成员将无法再访问此群")) return;
  await supabaseClient.from("group_members").delete().eq("group_id", gid);
  await supabaseClient.from("group_messages").delete().eq("group_id", gid);
  await supabaseClient.from("groups").delete().eq("id", gid);
  alert("群聊已解散");
  loadGroupList();
  currentGroupId = null;
  document.getElementById("chatTitle").innerText = "选择聊天";
  document.getElementById("groupActionBtn").style.display = "none";
  document.getElementById("messagesContainer").innerHTML = "";
}

async function loadGroupMessages() {
  if(!currentGroupId) return;
  const { data: ms } = await supabaseClient.from("group_messages").select("*").eq("group_id", currentGroupId).order("created_at");
  const box = document.getElementById("messagesContainer");
  let html = "";
  for (let m of ms||[]) {
    const mine = m.from_id === myId;
    const nick = await getNick(m.from_id);
    html += `<div class="message-item ${mine ? 'message-mine' : 'message-other'}">`;
    if (m.reply_content) html += `<div class="quote"><div class="quote-user">${m.reply_nickname}</div><div class="quote-content">${m.reply_content}</div></div>`;
    if (m.forward_info) html += `<div style="font-size:12px;opacity:0.8">${m.forward_info}</div>`;
    html += `${nick}：${m.content||''}`;
    if (m.file_url) html += `<div class="file-card"><div class="file-name">${m.file_name||'文件'}</div><button class="download-btn" onclick="window.open('${m.file_url}')">下载</button></div>`;
    html += `<div class="msg-actions">`;
    html += `<button onclick="startReply('${m.id}','${m.content||''}','${nick}')">回复</button>`;
    html += `<button onclick="doForward('${m.id}',true,'${m.content||''}','${m.file_url||''}','${nick}')">转发</button>`;
    html += `</div></div>`;
  }
  box.innerHTML = html;
  box.scrollTop = box.scrollHeight;
}

document.getElementById("fileInput").addEventListener("change", async e=>{
  const f = e.target.files[0]; if (!f) return;
  if(f.size > MAX_FILE_SIZE) return alert("文件不能超过50MB");
  const fn = `${myId}_${Date.now()}_${f.name}`;
  const { data } = await supabaseClient.storage.from("uploads").upload(`chat/${fn}`, f);
  const url = supabaseClient.storage.from("uploads").getPublicUrl(`chat/${fn}`).data.publicUrl;
  if (currentChatId) {
    await supabaseClient.from("messages").insert({
      from_id: myId, to_id: currentChatId, content: "", file_url: url, file_name: f.name, file_size: f.size
    });
    loadChatMessages();
  } else if (currentGroupId) {
    await supabaseClient.from("group_messages").insert({
      group_id: currentGroupId, from_id: myId, content: "", file_url: url, file_name: f.name, file_size: f.size
    });
    loadGroupMessages();
  }
  e.target.value = "";
});

function subscribeRealtime() {
  supabaseClient.removeAllChannels();
  supabaseClient.channel("chat").on("postgres_changes", { event: "*", schema: "public", table: "messages" }, ()=>{ if(currentChatId)loadChatMessages() }).subscribe();
  supabaseClient.channel("group").on("postgres_changes", { event: "*", schema: "public", table: "group_messages" }, ()=>{ if(currentGroupId)loadGroupMessages() }).subscribe();
  supabaseClient.channel("friends").on("postgres_changes", { event: "*", schema: "public", table: "friend_requests" }, ()=>{ loadFriendList(); loadFriendRequests() }).subscribe();
  supabaseClient.channel("groups").on("postgres_changes", { event: "*", schema: "public", table: "groups" }, ()=>{ loadGroupList() }).subscribe();
}

function toggleEmoji() {
  const p = document.getElementById("emojiPanel");
  p.style.display = p.style.display==="none" ? "grid" : "none";
}
function insertEmoji(e) {
  document.getElementById("messageInput").value += e;
  toggleEmoji();
}
</script>
