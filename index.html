<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>临时ID聊天</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial;background:#f1f1f1;height:100vh;overflow:hidden}
.container{display:flex;height:100vh;max-width:1200px;margin:0 auto}
.sidebar{width:280px;background:white;border-right:1px solid #ddd;padding:15px;display:flex;flex-direction:column;}
.hamburger{display:none;font-size:22px;background:none;border:none;position:fixed;top:10px,left:10px;z-index:10;background:white;padding:5px 10px;border-radius:5px;cursor:pointer;}
@media (max-width:600px){.sidebar{display:none;width:100%;position:fixed;height:100vh;z-index:9}.sidebar.show{display:flex}.hamburger{display:block}}
.my-id-card{background:#eef;padding:12px;border-radius:8px;margin:10px 0;font-size:14px;color:#333;}
.my-id-card span{font-weight:bold;color:#2563eb}
.btn{background:#4F46E5;color:white;border:none;padding:10px 12px;border-radius:6px;margin:5px 0;width:100%;cursor:pointer;font-size:14px;}
.btn-request{background:#f59e0b}
.section-title{font-weight:bold;margin-top:20px;margin-bottom:10px;font-size:16px;color:#333;}
.friend-list,.request-list{flex:1;overflow-y:auto;margin-top:5px;}
.friend-item,.request-item{padding:10px;background:#f9f9f9;margin:5px 0;border-radius:6px;cursor:pointer;font-size:14px;}
.request-item{display:flex;justify-content:space-between;align-items:center;background:#fffbeb;border:1px solid #f59e0b;}
.request-btn-group button{padding:4px 8px;border:none;border-radius:4px;margin-left:5px;cursor:pointer;font-size:12px;}
.btn-accept{background:#10b981;color:white}
.btn-reject{background:#ef4444;color:white}
.empty-tip{color:#999;padding:10px;font-size:14px;text-align:center;}
.chat-area{flex:1;display:flex;flex-direction:column;background:white;}
.chat-header{padding:15px;border-bottom:1px solid #ddd;font-weight:bold;font-size:16px;}
.messages-container{flex:1;padding:15px;overflow-y:auto;background:#f9fafb;}
.message-item{margin:8px 0;padding:10px 14px;border-radius:8px;max-width:70%;font-size:14px;line-height:1.4}
.message-mine{background:#4F46E5;color:white;margin-left:auto;}
.message-other{background:#e5e7eb;margin-right:auto;}
.input-container{display:flex;padding:10px;border-top:1px solid #ddd;background:white;}
.input-container input{flex:1;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:14px;outline:none;}
.input-container button{margin-left:8px;padding:10px 16px;background:#4F46E5;color:white;border:none;border-radius:6px;cursor:pointer;}
</style>
</head>
<body>
<button class="hamburger" onclick="toggleSidebar()">☰</button>
<div class="container">
  <div class="sidebar" id="sidebar">
    <div class="section-title">我的临时ID</div>
    <div class="my-id-card" id="myIdCard">加载中...</div>
    <button class="btn" onclick="showAddFriendModal()">➕ 添加好友</button>
    <button class="btn btn-request" onclick="toggleRequestList()">📩 好友申请</button>
    <div class="section-title">好友列表</div>
    <div class="friend-list" id="friendList"><div class="empty-tip">暂无好友，添加好友后显示</div></div>
    <div class="section-title" id="requestTitle" style="display:none">好友申请</div>
    <div class="request-list" id="requestList" style="display:none"><div class="empty-tip">暂无好友申请</div></div>
  </div>
  <div class="chat-area">
    <div class="chat-header" id="chatHeader">选择好友开始聊天</div>
    <div class="messages-container" id="messagesContainer"></div>
    <div class="input-container">
      <input type="text" id="messageInput" placeholder="输入消息..." onkeydown="if(event.key==='Enter')sendMessage()">
      <button onclick="sendMessage()">发送</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://hlhtcciaafwmxxtshtaa.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsaHRjY2lhYWZ3bXh4dHNodGFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzMDcyOTcsImV4cCI6MjA5MDg4MzI5N30.cn6RJt_0xXp54n2NvqMq0mFYwBVmdO6Q2NGdnwZicoU";

const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let myId;
let currentChatId = null;
let requestVisible = false;

window.onload = async () => {
  // ✅ 存在 localStorage，刷新/重开都不会变ID
  myId = localStorage.getItem("chatId") || generateId();
  localStorage.setItem("chatId", myId);

  document.getElementById("myIdCard").innerHTML = `ID：<span>${myId}</span>`;
  await supabase.from("users").upsert({ id: myId }, { onConflict: "id" });

  subscribeRealtime();
  loadFriendList();
  loadFriendRequests();
};

// 8位ID
function generateId() {
  const c = "0123456789abcdefghijklmnopqrstuvwxyz";
  return Array.from({length:8},()=>c[Math.floor(Math.random()*c.length)]).join("");
}

// ✅ 实时监听（自动刷新消息、好友、申请）
function subscribeRealtime() {
  supabase.removeAllChannels();

  // 好友申请实时
  supabase.channel(`req_${myId}`)
  .on("postgres_changes", {
      event: "*",
      schema: "public",
      table: "friend_requests",
      filter: `to_id.eq.${myId}`
    }, () => {
      loadFriendRequests();
      loadFriendList();
    })
  .subscribe();

  // 消息实时
  supabase.channel(`msg_${myId}`)
  .on("postgres_changes", {
      event: "INSERT",
      schema: "public",
      table: "messages",
      filter: `to_id.eq.${myId}`
    }, () => {
      if (currentChatId) loadChatMessages();
    })
  .subscribe();
}

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("show");
}

// 添加好友
function showAddFriendModal() {
  const t = prompt("输入对方8位ID：");
  if (!t || t.length!==8 || t===myId) return alert("无效ID");
  sendFriendRequest(t);
}

async function sendFriendRequest(tid) {
  const { data: u } = await supabase.from("users").select("id").eq("id", tid).maybeSingle();
  if (!u) return alert("对方ID不存在");

  const { data: ex } = await supabase.from("friend_requests")
   .select("id").eq("from_id", myId).eq("to_id", tid).eq("status", "pending");
  if (ex?.length) return alert("已发送过申请");

  await supabase.from("friend_requests").insert({ from_id: myId, to_id: tid, status: "pending" });
  alert("申请已发送");
}

// 申请列表显示/隐藏
function toggleRequestList() {
  requestVisible =!requestVisible;
  const t = document.getElementById("requestTitle");
  const l = document.getElementById("requestList");
  t.style.display = requestVisible?"block":"none";
  l.style.display = requestVisible?"block":"none";
  if (requestVisible) loadFriendRequests();
}

// 加载申请
async function loadFriendRequests() {
  const { data: r } = await supabase.from("friend_requests")
   .select("*").eq("to_id", myId).eq("status", "pending");

  const el = document.getElementById("requestList");
  if (!r?.length) {
    el.innerHTML = "<div class='empty-tip'>暂无好友申请</div>";
    return;
  }

  el.innerHTML = r.map(x=>`
    <div class="request-item">
      <span>${x.from_id}</span>
      <div class="request-btn-group">
        <button class="btn-accept" onclick="acceptFriendRequest('${x.id}')">同意</button>
        <button class="btn-reject" onclick="rejectFriendRequest('${x.id}')">拒绝</button>
      </div>
    </div>
  `).join("");
}

// 同意
async function acceptFriendRequest(id) {
  await supabase.from("friend_requests").update({ status: "accepted" }).eq("id", id);
  alert("已同意");
  loadFriendRequests();
  loadFriendList();
}

// 拒绝
async function rejectFriendRequest(id) {
  await supabase.from("friend_requests").update({ status: "rejected" }).eq("id", id);
  alert("已拒绝");
  loadFriendRequests();
}

// 好友列表
async function loadFriendList() {
  const { data: s } = await supabase.from("friend_requests")
   .select("to_id").eq("from_id", myId).eq("status", "accepted");

  const { data: r } = await supabase.from("friend_requests")
   .select("from_id").eq("to_id", myId).eq("status", "accepted");

  const f = [...(s||[]).map(i=>i.to_id), ...(r||[]).map(i=>i.from_id)];
  const uf = [...new Set(f)];

  const el = document.getElementById("friendList");
  if (uf.length === 0) {
    el.innerHTML = "<div class='empty-tip'>暂无好友</div>";
    return;
  }

  el.innerHTML = uf.map(id=>`
    <div class="friend-item" onclick="selectFriend('${id}')">${id}</div>
  `).join("");
}

// 选择聊天
function selectFriend(id) {
  currentChatId = id;
  document.getElementById("chatHeader").innerText = `和 ${id} 聊天中`;
  if (innerWidth <= 600) toggleSidebar();
  loadChatMessages();
}

// 发送消息
async function sendMessage() {
  const t = document.getElementById("messageInput").value.trim();
  if (!t) return;
  if (!currentChatId) return alert("请先选好友");

  await supabase.from("messages").insert({ from_id: myId, to_id: currentChatId, content: t });
  document.getElementById("messageInput").value = "";
  loadChatMessages();
}

// 加载消息
async function loadChatMessages() {
  if (!currentChatId) return;

  const { data: m1 } = await supabase.from("messages")
   .select("*").eq("from_id", myId).eq("to_id", currentChatId);

  const { data: m2 } = await supabase.from("messages")
   .select("*").eq("from_id", currentChatId).eq("to_id", myId);

  const all = [...(m1||[]), ...(m2||[])].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  const mc = document.getElementById("messagesContainer");

  mc.innerHTML = all.map(m=>`
    <div class="message-item ${m.from_id===myId ? 'message-mine' : 'message-other'}">
      ${m.content}
    </div>
  `).join("");

  mc.scrollTop = mc.scrollHeight;
}
</script>
</body>
</html>
